PACKAGE_NAME="snd-hda-scodec-cs35l41-thinkbook"
PACKAGE_VERSION="1.0"

MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="snd-hda-scodec-cs35l41"
BUILT_MODULE_NAME[1]="snd-hda-scodec-cs35l41-i2c"
BUILT_MODULE_NAME[2]="snd-hda-scodec-cs35l41-spi"

DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
DEST_MODULE_LOCATION[2]="/updates/dkms"

AUTOINSTALL="yes"

# Only build for Debian trixie 6.12.x kernels. Newer kernels should be
# checked for native 17AA3929 support instead of forcing this backport.
BUILD_EXCLUSIVE_KERNEL="^6\.12\."
